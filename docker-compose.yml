services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulsepass
      POSTGRES_DB: pulse
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    restart: unless-stopped
    build: ./backend
    command: ["-mode=api"]
    ports:
      - "8080:8080"
      - "9101:9100"
    environment:
      PORT: "8080"
      METRICS_PORT: "9100"
      DATABASE_URL: postgres://pulse:pulsepass@postgres:5432/pulse?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — copy .env.example to .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    restart: unless-stopped
    build: ./backend
    command: ["-mode=scheduler"]
    ports:
      - "9105:9100"
    environment:
      METRICS_PORT: "9100"
      DATABASE_URL: postgres://pulse:pulsepass@postgres:5432/pulse?sslmode=disable
      REDIS_ADDR: redis:6379
      PULSE_ALLOW_HOSTS: ${PULSE_ALLOW_HOSTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Explicit worker instances (fixed metrics ports) instead of replicas,
  # so each process's /metrics is scrapable. Bench starts/stops subsets.
  worker-1:
    restart: unless-stopped
    build: ./backend
    command: ["-mode=worker"]
    ports:
      - "9102:9100"
    environment:
      METRICS_PORT: "9100"
      DATABASE_URL: postgres://pulse:pulsepass@postgres:5432/pulse?sslmode=disable
      REDIS_ADDR: redis:6379
      PULSE_ALLOW_HOSTS: ${PULSE_ALLOW_HOSTS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-2:
    restart: unless-stopped
    build: ./backend
    command: ["-mode=worker"]
    ports:
      - "9103:9100"
    environment:
      METRICS_PORT: "9100"
      DATABASE_URL: postgres://pulse:pulsepass@postgres:5432/pulse?sslmode=disable
      REDIS_ADDR: redis:6379
      PULSE_ALLOW_HOSTS: ${PULSE_ALLOW_HOSTS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-3:
    restart: unless-stopped
    build: ./backend
    command: ["-mode=worker"]
    ports:
      - "9104:9100"
    environment:
      METRICS_PORT: "9100"
      DATABASE_URL: postgres://pulse:pulsepass@postgres:5432/pulse?sslmode=disable
      REDIS_ADDR: redis:6379
      PULSE_ALLOW_HOSTS: ${PULSE_ALLOW_HOSTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-4:
    restart: unless-stopped
    build: ./backend
    command: ["-mode=worker"]
    ports:
      - "9106:9100"
    environment:
      METRICS_PORT: "9100"
      DATABASE_URL: postgres://pulse:pulsepass@postgres:5432/pulse?sslmode=disable
      REDIS_ADDR: redis:6379
      PULSE_ALLOW_HOSTS: ${PULSE_ALLOW_HOSTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Deterministic stub target for benchmarks. Bench-only profile:
  #   docker compose --profile bench up -d stub
  stub:
    restart: unless-stopped
    build:
      context: ./bench/stub
      dockerfile_inline: |
        FROM golang:1.27-alpine AS b
        WORKDIR /s
        COPY main.go .
        RUN CGO_ENABLED=0 go build -o stub main.go
        FROM alpine:3.20
        COPY --from=b /s/stub /stub
        EXPOSE 8099
        ENTRYPOINT ["/stub"]
    profiles: [bench]
    ports:
      - "8099:8099"

volumes:
  pgdata:
  redisdata:
