global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pulse-api
    static_configs:
      - targets: ['api:9100']
  - job_name: pulse-scheduler
    static_configs:
      - targets: ['scheduler:9100']
  - job_name: pulse-workers
    static_configs:
      - targets: ['worker-1:9100', 'worker-2:9100', 'worker-3:9100', 'worker-4:9100']
